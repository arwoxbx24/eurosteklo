<style>
/* Роли слева: подписи дорожек закреплены у левого края карты (.mapwrap svg) при прокрутке и масштабе. */
.lanes-pin .lp-sh{opacity:0;transition:opacity .15s}
.lanes-pin.on .lp-sh{opacity:1}
.lanes-pin{pointer-events:none}
/* e4: подпись роли кликабельна — панель «Кто за что отвечает» (mappanel.html) */
.lanes-pin .lp-role{pointer-events:auto;cursor:pointer}
.lanes-pin .lp-role:hover text,.lanes-pin .lp-role:focus text{text-decoration:underline}
.lanes-pin .lp-role:focus{outline:none}.lanes-pin .lp-role:focus rect:not(.lp-sh){stroke:#b8480f;stroke-width:3}
@media print{.lanes-pin g{transform:none!important}.lanes-pin .lp-sh{display:none}}
</style>
<script>
/* Роли слева (spec 006, ADR-А). Подписи дорожек остаются в SVG: скрипт собирает полосу подписей
   (rect x ≤ 20, ширина ≤ 200, заливка полосы; text x < 40 внутри полосы; заголовки слоёв) в g.lanes-pin
   в конце SVG (перед точками, если они идут последними) и сдвигает её на видимый левый край.
   Сдвиг пересчитывается при прокрутке .mapwrap и при изменении размера SVG (ResizeObserver) — zoom.html не меняется.
   Красные точки (g.pt) и связи не трогаются. Без JS и при печати подписи на месте. */
(function(){
function run(){
var wrap=document.querySelector('.mapwrap'),svg=wrap&&wrap.querySelector('svg');
if(!svg||svg.querySelector('.lanes-pin')||!svg.getScreenCTM)return;
var NS='http://www.w3.org/2000/svg',LANE='#eef1f5',vb=svg.viewBox&&svg.viewBox.baseVal;
var vbW=vb&&vb.width?vb.width:svg.getBBox().width;
var S=svg.getScreenCTM();if(!S)return;var Si=S.inverse();
function skip(el){return el.closest('.pt,defs,marker,.lanes-pin')}
function base(el){var m=Si.multiply(el.getScreenCTM());return{e:m.e,f:m.f}}
function num(el,a){var v=el.getAttribute(a);return v==null?0:parseFloat(v)||0}
function box(el){var b=el.getBBox(),m=base(el);return{x:b.x+m.e,y:b.y+m.f,w:b.width,h:b.height,m:m}}
var rects=[].slice.call(svg.querySelectorAll('rect')).filter(function(r){return !skip(r)}),
    lanes=[],wide=[],bands=[];
rects.forEach(function(r){var x=num(r,'x'),w=num(r,'width'),h=num(r,'height'),f=(r.getAttribute('fill')||'').toLowerCase();
 if(x<=20&&w>0&&w<=200&&h>=30&&f===LANE)lanes.push({el:r,b:box(r),items:[]});
 else if(x<=20&&w>=1000){var o={el:r,b:box(r)};wide.push(o);if(h<=60&&f&&f!=='none')bands.push(o)}});
if(!lanes.length)return;
function inside(a,b){return a.x>=b.x-1&&a.y>=b.y-1&&a.x+a.w<=b.x+b.w+1&&a.y+a.h<=b.y+b.h+1}
function limitOf(b){var lim=vbW-(b.x+b.w),best=null;
 wide.forEach(function(o){if(o.b.h>60&&inside(b,o.b)&&(!best||o.b.w*o.b.h<best.w*best.h))best=o.b});
 if(best)lim=Math.min(lim,best.x+best.w-(b.x+b.w));return Math.max(0,lim)}
var heads=[];
[].slice.call(svg.querySelectorAll('text')).forEach(function(t){
 if(skip(t)||t.getAttribute('x')==null||num(t,'x')>=40)return;var b=box(t),cy=b.y+b.h/2,cx=b.x+2;
 for(var i=0;i<lanes.length;i++){var L=lanes[i].b;if(cx>=L.x&&cx<=L.x+L.w&&cy>=L.y&&cy<=L.y+L.h){lanes[i].items.push(t);return}}
 for(var j=0;j<bands.length;j++){var B=bands[j].b;if(cy>=B.y&&cy<=B.y+B.h){heads.push({t:t,b:b,band:bands[j]});return}}});
/* тень справа */
var defs=svg.querySelector('defs')||svg.insertBefore(document.createElementNS(NS,'defs'),svg.firstChild),
    gr=document.createElementNS(NS,'linearGradient');gr.id='lanes-pin-sh';
[['0','.22'],['1','0']].forEach(function(s){var st=document.createElementNS(NS,'stop');st.setAttribute('offset',s[0]);
 st.setAttribute('stop-color','#0f172a');st.setAttribute('stop-opacity',s[1]);gr.appendChild(st)});defs.appendChild(gr);
function mk(tag,at){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);return e}
var pin=mk('g',{'class':'lanes-pin'}),units=[];
function unit(m,x0,lim,nodes,sh){var outer=mk('g',{transform:'translate('+m.e+','+m.f+')'}),inner=mk('g',{});
 if(sh)inner.appendChild(mk('rect',{'class':'lp-sh',x:sh.x,y:sh.y,width:10,height:sh.h,fill:'url(#lanes-pin-sh)'}));
 nodes.forEach(function(n){inner.appendChild(n)});outer.appendChild(inner);pin.appendChild(outer);
 units.push({g:inner,x0:x0,lim:lim});return outer}
lanes.forEach(function(L){var r=L.el,b=L.b,m=b.m;
 /* подложка непрозрачная: заливка полосы как есть (#eef1f5), без прозрачности */
 r.removeAttribute('fill-opacity');r.removeAttribute('opacity');
 L.lim=limitOf(b);L.g=unit(m,b.x,L.lim,[r].concat(L.items),{x:num(r,'x')+num(r,'width'),y:num(r,'y'),h:num(r,'height')})});
heads.forEach(function(H){var bb=H.band.b,br=H.band.el,m=H.b.m,sw=parseFloat(br.getAttribute('stroke-width'))||0,
 lx=bb.x-m.e+sw/2,ly=bb.y-m.f+sw/2,w=H.b.x+H.b.w-bb.x+16,h=bb.h-sw,
 bg=mk('rect',{x:lx,y:ly,width:w,height:h,fill:br.getAttribute('fill')});
 unit(m,bb.x,Math.max(0,bb.x+bb.w-(bb.x+w)),[bg,H.t],{x:lx+w,y:ly,h:h})});
/* в самый конец SVG: закреплённая колонка ролей перекрывает всё, что уезжает под неё при прокрутке (в т.ч. красные точки) */
svg.appendChild(pin);
roles();
var raf=0;
function upd(){raf=0;var R=svg.getBoundingClientRect();if(!R.width)return;
 var wr=wrap.getBoundingClientRect(),s=(wr.left+wrap.clientLeft-R.left)*vbW/R.width,on=false;
 units.forEach(function(u){var t=Math.max(0,Math.min(s-u.x0,u.lim));if(t>.5)on=true;
  var v='translate('+t.toFixed(2)+',0)';if(u.v!==v){u.v=v;u.g.setAttribute('transform',v)}});
 pin.classList.toggle('on',on)}
function req(){if(!raf)raf=requestAnimationFrame(upd)}
/* e4 «Кто за что отвечает»: клик по подписи роли → панель справа. Данные только с карты: узлы — g с <title>,
   центр рамки внутри полосы роли по Y и правее полосы (в пределах слоя) по X; текст — видимые <text> узла
   без служебного «id Miro …»; красные точки (g.pt) в той же полосе — номер, заголовок из <title>, ссылка точки. */
function roles(){
 function tl(e){var f=e.firstElementChild;return !!f&&f.tagName.toLowerCase()==='title'}
 function owner(t){for(var e=t.parentNode;e&&e!==svg;e=e.parentNode)if(e.tagName&&e.tagName.toLowerCase()==='g'&&tl(e))return e;return null}
 function clean(s){return (s||'').replace(/\s+/g,' ').trim()}
 function inLane(L,cx,cy){var b=L.b;return cy>=b.y&&cy<=b.y+b.h&&cx>b.x+b.w&&cx<=b.x+b.w+L.lim+1}
 var nodes=[];
 [].slice.call(svg.querySelectorAll('g')).forEach(function(g){if(!tl(g)||skip(g))return;
  var tx=[].slice.call(g.querySelectorAll('text')).filter(function(t){return owner(t)===g})
   .map(function(t){return clean(t.textContent)}).filter(function(s){return s&&!/^id Miro/i.test(s)});
  if(!tx.length)return;var b=box(g);nodes.push({x:b.x+b.w/2,y:b.y+b.h/2,text:tx.join(' ')})});
 var pts=[];
 [].slice.call(svg.querySelectorAll('g.pt')).forEach(function(g){var c=g.querySelector('circle');if(!c)return;
  var b=box(c),ti=g.querySelector('title'),lb=g.querySelector('text'),a=g.closest('a'),m=/^p(\d+)$/.exec(g.id||'');
  pts.push({x:b.x+b.w/2,y:b.y+b.h/2,n:m?m[1]:'',lab:clean(lb&&lb.textContent),
   title:clean(ti&&ti.textContent).replace(/^Точка \d+:\s*/,''),href:a&&(a.getAttribute('href')||a.getAttribute('xlink:href')),tgt:a&&a.getAttribute('target')})});
 lanes.forEach(function(L){
  var bold=[],rest=[];
  L.items.slice().sort(function(a,b){return box(a).y-box(b).y}).forEach(function(t){var s=clean(t.textContent);if(!s)return;
   var w=parseInt(getComputedStyle(t).fontWeight,10)||400;(w>=600?bold:rest).push(s)});
  var name=bold.join(' ')||rest.shift()||'роль',
      mine=nodes.filter(function(n){return inLane(L,n.x,n.y)}).sort(function(a,b){return a.x-b.x||a.y-b.y}),
      mp=pts.filter(function(p){return inLane(L,p.x,p.y)}).sort(function(a,b){return a.x-b.x||a.y-b.y}),
      head=null;
  heads.forEach(function(H){if(H.b.y<L.b.y&&(!head||H.b.y>head.b.y))head=H});
  var g=L.g,tt=document.createElementNS(NS,'title');tt.textContent=name+' — нажмите: кто за что отвечает';g.insertBefore(tt,g.firstChild);
  g.setAttribute('class','lp-role');g.setAttribute('tabindex','0');g.setAttribute('role','button');
  g.setAttribute('aria-label','Кто за что отвечает — '+name);
  function show(){var P=window.evroPanel;if(!P)return;var out=[];
   function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
   if(head)out.push(el('p','mp-sub','Раздел карты: '+clean(head.t.textContent)));
   if(rest.length)out.push(el('p','mp-sub','Подпись на карте: '+rest.join(' · ')));
   out.push(el('h3',null,'Действия и документы в дорожке ('+mine.length+')'));
   if(mine.length){var ul=el('ul','mp-list');mine.forEach(function(n){ul.appendChild(el('li',null,n.text))});out.push(ul)}
   else out.push(el('p','mp-sub','В этой дорожке на карте нет узлов с подписью.'));
   out.push(el('h3',null,'Красные точки — вопросы в дорожке ('+mp.length+')'));
   if(mp.length){var ul2=el('ul','mp-pts');mp.forEach(function(p){var li=el('li'),a=el('a','pt',p.lab||p.n);
     if(p.href)a.href=p.href;if(p.tgt)a.target=p.tgt;if(p.n)a.setAttribute('data-n',p.n);a.title='Вопрос к встрече';
     li.appendChild(a);li.appendChild(el('span',null,p.title));ul2.appendChild(li)});out.push(ul2)}
   else out.push(el('p','mp-sub','Красных точек в этой дорожке нет.'));
   out.push(el('p','mp-note','Собрано с карты: всё, что нарисовано в полосе роли. Разбивка по дорожкам — разметка карты, а не утверждённый регламент.'));
   P.open('Кто за что отвечает — '+name,out,g)}
  var dx=0,dy=0;
  g.addEventListener('mousedown',function(e){dx=e.clientX;dy=e.clientY});
  g.addEventListener('click',function(e){if(Math.abs(e.clientX-dx)>5||Math.abs(e.clientY-dy)>5)return;show()});
  g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}})})}
wrap.addEventListener('scroll',req,{passive:true});addEventListener('resize',req);
if(window.ResizeObserver)new ResizeObserver(req).observe(svg);
upd()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
