<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ППО — образец простым языком</title>
<style>
:root{
  --paper:#fffdf9;
  --page:#e6e2d9;
  --ink:#1f2933;
  --muted:#4a5561;
  --line:#c9c3b6;
  --accent:#b4470f;        /* единственный акцент: номер фазы, вопросы */
  --accent-soft:#fbeadf;
  --see:#2b5b7f;           /* что видим — сине-стальной */
  --see-soft:#e8f0f6;
  --ask:#b4470f;           /* что спросить — акцент */
  --ask-soft:#fbeadf;
  --unk:#5c4a72;           /* чего не знаем — приглушённый сливовый */
  --unk-soft:#f0ecf5;
  --z:1;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--page);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","DejaVu Sans",sans-serif;
  font-size:17px;
  line-height:1.3;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}

/* ---------- лента слайдов на экране ---------- */
.deck{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  padding:20px 20px 8px;
}

.slide{
  position:relative;
  overflow:hidden;
  flex:none;
  width:1280px;
  height:720px;
  margin:0 0 32px;
  padding:34px 48px 26px;
  background:var(--paper);
  border-top:10px solid var(--accent);
  box-shadow:0 6px 24px rgba(31,41,51,.28),0 1px 3px rgba(31,41,51,.3);
  display:flex;
  flex-direction:column;
  gap:16px;
  zoom:var(--z);
}

/* масштаб под узкое окно: доступная ширина = ширина окна − 40px */
@media (max-width:1320px){:root{--z:.98}}
@media (max-width:1300px){:root{--z:.95}}
@media (max-width:1260px){:root{--z:.92}}
@media (max-width:1220px){:root{--z:.89}}
@media (max-width:1180px){:root{--z:.86}}
@media (max-width:1140px){:root{--z:.83}}
@media (max-width:1100px){:root{--z:.80}}
@media (max-width:1060px){:root{--z:.77}}
@media (max-width:1020px){:root{--z:.74}}
@media (max-width:980px){:root{--z:.71}}
@media (max-width:940px){:root{--z:.68}}
@media (max-width:900px){:root{--z:.65}}
@media (max-width:860px){:root{--z:.62}}
@media (max-width:820px){:root{--z:.59}}
@media (max-width:780px){:root{--z:.56}}
@media (max-width:740px){:root{--z:.53}}
@media (max-width:700px){:root{--z:.50}}
@media (max-width:660px){:root{--z:.47}}
@media (max-width:620px){:root{--z:.44}}
@media (max-width:580px){:root{--z:.41}}
@media (max-width:540px){:root{--z:.38}}
@media (max-width:500px){:root{--z:.35}}
@media (max-width:460px){:root{--z:.32}}
@media (max-width:420px){:root{--z:.29}}
@media (max-width:380px){:root{--z:.26}}
@media (max-width:340px){:root{--z:.23}}
@media (max-width:300px){:root{--z:.20}}

/* ---------- шапка слайда ---------- */
.slide > header{
  display:grid;
  grid-template-columns:78px 1fr;
  column-gap:22px;
  row-gap:2px;
  align-items:center;
  flex:none;
}
.num{
  grid-row:1 / span 2;
  width:78px;height:78px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:44px;
  font-weight:800;
  line-height:78px;
  text-align:center;
  box-shadow:0 0 0 5px var(--accent-soft);
}
.slide h2{
  margin:0;
  font-size:38px;
  line-height:1.12;
  font-weight:800;
  letter-spacing:-.01em;
  color:var(--ink);
}
.lead{
  margin:0;
  font-size:21px;
  line-height:1.25;
  color:var(--muted);
}

/* ---------- горизонтальные шаги ---------- */
.flow{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  gap:44px;
  flex:none;
}
.flow .step{
  position:relative;
  flex:1 1 0;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  padding:9px 14px;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:10px;
  font-size:18px;
  line-height:1.2;
}
.flow .step b{font-size:19px;font-weight:800}
.flow .step span{font-size:16px;color:var(--muted)}
.flow .step:not(:last-child)::after{
  content:"\27A4";            /* ➤ */
  position:absolute;
  right:-38px;
  top:50%;
  width:32px;
  margin-top:-16px;
  font-size:26px;
  line-height:32px;
  text-align:center;
  color:var(--accent);
}

/* ---------- три зоны ---------- */
.zones{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.zone{
  min-width:0;
  min-height:0;
  overflow:hidden;
  border:2px solid var(--zc);
  border-radius:12px;
  background:var(--zs);
  display:flex;
  flex-direction:column;
}
.zone.see{--zc:var(--see);--zs:var(--see-soft)}
.zone.ask{--zc:var(--ask);--zs:var(--ask-soft)}
.zone.unk{--zc:var(--unk);--zs:var(--unk-soft);border-style:dashed}

.zone h3{
  margin:0;
  padding:9px 16px;
  background:var(--zc);
  color:#fff;
  font-size:21px;
  line-height:1.2;
  font-weight:800;
  flex:none;
}
/* значок в шапке: цвет не единственный носитель смысла */
.zone.see h3::before{content:"\25C9\00A0"}   /* ◉ */
.zone.ask h3::before{content:"?\00A0"}
.zone.unk h3::before{content:"\2715\00A0"}   /* ✕ */

.zone ul,.zone ol{
  margin:0;
  padding:10px 14px 8px 16px;
  list-style:none;
  counter-reset:n;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.zone li{
  position:relative;
  padding-left:22px;
  font-size:17px;
  line-height:1.28;
  counter-increment:n;
}
.zone.see li::before{content:"\25CF";position:absolute;left:0;top:0;color:var(--see);font-size:15px}
.zone.unk li::before{content:"\25CB";position:absolute;left:0;top:0;color:var(--unk);font-size:15px}
.zone.ask li{padding-left:28px}
.zone.ask li::before{
  content:counter(n) ".";
  position:absolute;left:0;top:0;
  font-weight:800;color:var(--ask);
}
.zone em.show{
  display:block;
  margin-top:2px;
  font-style:normal;
  font-weight:600;
  color:var(--accent);
}
.src{
  display:block;
  margin-top:1px;
  font-size:16px;
  line-height:1.2;
  color:var(--muted);
}

/* ---------- статус-чипы (слово + значок + цвет) ---------- */
.st{
  display:inline-block;
  padding:0 9px;
  margin-left:2px;
  border-radius:999px;
  border:1.5px solid currentColor;
  font-size:16px;
  line-height:22px;
  font-weight:700;
  white-space:nowrap;
  vertical-align:1px;
  background:#fff;
}
.st-board{color:#1c6b3a}
.st-board::before{content:"\2713\00A0"}   /* ✓ */
.st-said{color:#8a5a00}
.st-said::before{content:"\201C\00A0"}    /* “ */
.st-unk{color:#8f1d2c;border-style:dashed}
.st-unk::before{content:"?\00A0"}

/* ---------- подвал ---------- */
.slide > footer{
  flex:none;
  padding-top:6px;
  border-top:1px solid var(--line);
  font-size:16px;
  line-height:1.25;
  color:var(--muted);
}

/* ---------- слайд блокеров ---------- */
.slide-blockers .blk{
  flex:1 1 auto;
  align-self:stretch;
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  background:#fff;
  font-size:18px;
  line-height:1.28;
}
.blk thead th{
  padding:11px 14px;
  background:var(--unk);
  color:#fff;
  font-size:19px;
  font-weight:800;
  text-align:left;
  border:1px solid var(--unk);
}
.blk th:nth-child(1),.blk td:nth-child(1){width:64px;text-align:center}
.blk th:nth-child(2),.blk td:nth-child(2){width:31%}
.blk th:nth-child(3),.blk td:nth-child(3){width:23%}
.blk td{
  padding:9px 14px;
  vertical-align:top;
  border:1px solid var(--line);
}
.blk td:nth-child(1){font-weight:800;color:var(--accent);font-size:22px}
.blk td:nth-child(2){font-weight:700}
.blk tbody tr:nth-child(even) td{background:var(--unk-soft)}
.blk small,.blk .src{font-size:16px}
.slide-blockers{justify-content:flex-start}

/* ---------- печать: страница = слайд ---------- */
@page{size:1280px 720px;margin:0}
@media print{
  :root{--z:1}
  html,body{
    margin:0;
    padding:0;
    background:#fff;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .deck{display:block;padding:0;margin:0}
  .slide{
    zoom:1;
    margin:0;
    box-shadow:none;
    width:1280px;
    height:720px;
    break-after:page;
    page-break-after:always;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .slide:last-child{break-after:auto;page-break-after:auto}
}
.zone .src,.blk .src{display:none}
.blk td{font-size:17px;padding:8px 12px}
.blk td:nth-child(1){font-size:20px}
.zone li{margin-bottom:5px}
.zone.ask li{line-height:1.25}
.slide-blockers .blk td{padding:5px 12px}
.tp{display:inline-block;font-size:15px;font-weight:800;padding:1px 10px;border-radius:999px;border:2px solid currentColor;white-space:nowrap}
.tp-cond::before{content:"▤ "}.tp-fork::before{content:"⑂ "}.tp-conf::before{content:"⚡ "}
.tp-cond{color:#28597a;background:#e8eff5}.tp-fork{color:#8a5a00;background:#fbf1d9}.tp-conf{color:#8c1d1d;background:#f8e3e3;border-style:dashed}
.blk:has(.tp) td:nth-child(2){width:15%;font-weight:400}
.blk:has(.tp) th:nth-child(2){width:15%}
</style>
</head>

</main>
</body>
</html>
