<text x="216" y="1370" font-family="system-ui,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">• Сделка ↔ заказ 1С создаются друг из друга автоматически (План D6): «Новый заказ покупателя в 1С создается автоматически при создании сделки в Б24. Аналагично сделки в Б24 создается автоматически при создании в 1С заказа покупателя.» — 1С — неизвестно, уточнить</text>
<text x="216" y="1396" font-family="system-ui,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">• 4 статуса 1С («В производстве», «Изготовлен Откосово», «Изготовлен», «Принято на склад») видны в Б24 одной стадией «В производстве» (План I12: «Битрикс отабражает статус - в производстве») — 1С — неизвестно, уточнить.</text>
<text x="216" y="1422" font-family="system-ui,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">• Статуса «Отгрузка» нет ни в Б24, ни в 1С («Принято на склад … готово к отгрузке» → сразу «Монтаж»; «Документы» — «после отгрузки и монтажа»).</text>
<text x="216" y="1448" font-family="system-ui,sans-serif" font-size="14" fill="#1f2937" text-anchor="start">• Кто ведёт статус (План, J): «Управляются в битрикс» — Предв. заявка (J6), Монтаж (J17), Рекламация (J23); «1С» — Оплата (J9), В производстве (J12), Закрытие сделки (J19); Замеры (J7), Исполнена (J21) — пусто, информации нет. 1С — неизвестно, уточнить. «Исполнена»: схема ТЗ ↔ статусы — С18.</text>

465" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С21</text></g><g class="pt"><title>Точка 7: договор: в ТЗ — «Менеджер создает договор в 1с», на доске — типовая форма («форму согласовать с юристом бухгалтером») или форма Заказчика; кто решает</title><circle cx="912" cy="410" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="912" y="415" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С7</text></g><g class="pt"><title>Точка 8: подписание: признак «подписан», срок; таймеры доски «через 2, 3 дня» и «смена стадии через 3 рабочих дня (стадия ДОГОВОР)» — куда и от какого события</title><circle cx="1140" cy="400" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1140" y="405" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С8</text></g><g class="pt"><title>Точка 15: оплата остатка 100 %: где «ворота» (Изготовлено или Отгрузка), два блока Менеджера ОП дублируют друг друга; действует ли при монтаже</title><circle cx="2136" cy="200" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="2136" y="205" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С15</text></g><g class="pt"><title>Точка 19: после сделки: звонки 14/90/270 — на доске Ассистент ОП; в ТЗ — только «Позвони клиенту» в разделе развития (п.12), без сроков; от какой даты считать, что делать с результатом звонка</title><circle cx="2580" cy="732" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="2580" y="737" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С19</text></g><g class="pt"><title>Точка 3: кто договаривается о замере и кто замеряет; что считается результатом замера</title><circle cx="670" cy="836" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="670" y="841" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С3</text></g><g class="pt"><title>Точка 10: кто запускает производство: статусы — «нач. производства, плановик» в 1С; доска — Менеджер ОП → Рук. ПТО; ТЗ — одна задача сотруднику производства; Рук. ПТО и Руководитель производства — одна роль или две</title><circle cx="1670" cy="1126" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1670" y="1131" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С10</text></g><g class="pt"><title>Точка 11: фурнитура: со склада или закупка; «заявка на внутреннее потребление» — что это и чья</title><circle cx="1540" cy="1366" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1540" y="1371" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С11</text></g><g class="pt"><title>Точка 5: номенклатура и «понижающие коэффициенты»: уведомление Рук. ОС; при понижающих коэффициентах — виза Рук. СС; порог, срок, исходы не заданы</title><circle cx="412" cy="1546" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="412" y="1551" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С5</text></g><g class="pt"><title>Точка 16: монтаж: условия выезда, кто монтирует, приёмка клиентом, фото, переделка и перенос</title><circle cx="2330" cy="1546" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="2330" y="1551" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С16</text></g><g class="pt"><title>Точка 23: уведомления (15 уникальных комментариев на доске): у всех нет срока реакции и «что если не отреагировал»</title><circle cx="1232" cy="1737" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1232" y="1742" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С23</text></g><g class="pt"><title>Точка 25: Производство запускается от файла DXF — где проверка оплаты?</title><circle cx="1540" cy="227" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1540" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С25</text></g><g class="pt"><title>Точка 27: Где формируются документы: «автоматическое формирование» на доске ↔ «в 1С» по ТЗ</title><circle cx="656" cy="297" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="656" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С27</text></g><g class="pt"><title>Точка 29: «Заявка» — это стадия или вся сделка?</title><circle cx="668" cy="50" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="668" y="55" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">С29</text></g><g class="pt"><title>Точка 2: Замер: в ТЗ развилка «Требуется замер / Замер не требуется», об оплате замера не сказано; на доске — счёт на оплату замера → задание на замер, оплата условием задания не названа</title><circle cx="440" cy="2180" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="440" y="2185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff">С2</text></g><g class="pt"><title>Точка 6: «Согласование сделки»: в ТЗ ставит Система после «КП согласовано», в статусах — «рук. сервиса или конструктор»; на доске три стадии (Заявка, Договор, Подписание), договор ведёт Менеджер ОП; что три стадии доски соответствуют одной — наше сопоставление</title><circle cx="1612" cy="1940" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1612" y="1945" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff">С6</text></g><g class="pt"><title>Точка 17: Закрывающие документы: в ТЗ акты в 1С загружает сотрудник монтажа; на доске — УПД, фото, возврат документов Ассистентом ОП; статус «Документы» в файле статусов описан двумя способами</title><circle cx="2512" cy="2448" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="2512" y="2453" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff">С17</text></g><g class="pt"><title>Точка 18: Когда сделка «Исполнена»: схема ТЗ — сразу после оплаты; текст ТЗ — после «Сделка завершена успешно»; статусы — «Документы» → «Завершен» e-width="2"/><text x="1508.0" y="2960" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff">С12</text></g><g class="pt"><title>Точка 26: Сроки ожидания оплаты: «2, 3 дня / 3 рабочих» на доске ↔ «&gt; 3 / &gt; 5 дней» в ТЗ</title><circle cx="1908" cy="2600" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="1908" y="2605" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff">С26</text></g><g class="pt"><title>Точка 28: Что передаётся между Б24 и 1С: на доске — только номенклатура</title><circle cx="214" cy="1940" r="16" fill="#d93025" stroke="#fff" stroke-width="2"/><text x="214" y="1945" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#fff">С28</text></g></svg>
